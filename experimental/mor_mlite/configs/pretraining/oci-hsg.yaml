# Independent experiment recipe; never changes the shared cluster defaults.
SLURM:
  cluster: oci-hsg
  nnodes: 16
  ntasks_per_node: 4
  gpus_per_node: 4
  segment: 4
  time_limit: '24:00:00'
EXPERIMENT:
  arms: [A, B, C, D]
  world_size: 64
  fallback_world_size: 32
  global_batch_size: 2048
  seq_length: 4096
  seed: 1234
  ep: 16
  tp: 1
  cp: 1
  pp: 1
  etp: 1
  precision: bf16
  optimizer: distributed_adamw
  lr: 0.0003
  min_lr: 0.00003
  warmup_fraction: 0.01
  betas: [0.9, 0.95]
  eps: 0.00000001
  weight_decay: 0.1
  clip_grad: 1.0
  moe_aux: 0.001
  depth_aux: 0.001
TUNING:
  candidates: [1, 2, 4, 8]
  warmup_updates: 20
  measured_updates: 30
  advance_peak_fraction: 0.80
  eligible_peak_fraction: 0.90
  throughput_tie_fraction: 0.03
DATA:
  # Existing 48.23B corpus is not approved without tokenizer provenance.
  existing_corpus_status: unverified_tokenizer_provenance
  replacement_target_tokens: 50000000000
  replacement_dataset: gmongaras/SlimPajama-627B_Reupload
  replacement_revision: c34c22dbb10ae6b264a2f357a909d1a537141b36
  replacement_scope: train_only_parquet_mirror_whole_document_prefix
  tokenizer: Qwen/Qwen3-30B-A3B-Base
  tokenizer_revision: 1b75feb79f60b8dc6c5bc769a898c206a1c6a4f9
  eos: 151643
  validation_document_hash_modulus: 1000
  chat_template: false
VERSIONS:
  megatron_commit: 5c8315f12a64a7279eec58896af9e74ee3351b74
  gb200_container_status: environment_probe_only_not_training_validated
