# ============================================================
# Single-node MINIMAL smoke-test recipe for the sync-free DeepEP GPT-MoE.
#
# Derived from the online job j-5gkeia28y4 ("[sync-free][prof] NV Megatron
# DeepEP baseline"), which uses the DeepEP flex dispatcher (NOT hybridep) with
# NO paged stash and NO device-init GroupedTensor.
#
# Purpose: a fast, self-contained config that fits on ONE 8-GPU node so config
# changes can be validated locally instead of round-tripping through a cluster
# job. Only the SIZE and TOPOLOGY are shrunk; every method-level switch
# (DeepEP dispatcher, 1F1B combined overlap, MTP, bf16+mxfp8, selective
# recompute) is kept identical to the online job.
#
# Topology: TP1 / PP2 / EP4 / CP1  -> world = TP*PP*DP*CP = 1*2*4*1 = 8 GPUs
#   (DP=4 gives the EP=4 expert group; num_experts=8 is divisible by EP=4.)
#
# Shrunk vs online (28L / hidden7168 / ffn20480 / 48 experts / moe_ffn5120):
#   num_layers 28 -> 4,  hidden 7168 -> 512,  ffn 20480 -> 1024,
#   num_experts 48 -> 8, moe_ffn 5120 -> 512, moe_shared_expert 5120 -> 512,
#   heads 128 -> 8, kv_channels 256 -> 64, num_query_groups 8 -> 2,
#   seq/max_pos 24576 -> 512, global_batch 768 -> 8, train_iters 1000 -> 10,
#   moe_layer_freq ([0]*4+[1]*24) -> ([0]*1+[1]*3) (1 dense + 3 MoE = 4 layers).
#
# recompute_modules: online uses [moe_act, layernorm, linear_qkv], but THIS
# repo's selective recompute allows only core_attn/moe_act/layernorm/mla_up_proj/
# mlp/moe/shared_experts/mhc/gdn, so linear_qkv is dropped here.
#
# Consumed by examples/sync_free_hybridep/pretrain.sh.
ENV_VARS:
  NVTE_ALLOW_NONDETERMINISTIC_ALGO: '1'
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  CUDA_DEVICE_MAX_CONNECTIONS: '1'
  NCCL_NVLS_ENABLE: '0'
  NCCL_GRAPH_REGISTER: '0'
  NCCL_DEBUG: WARN
  NVTE_FUSED_ATTN: '1'
  NVTE_NORM_FWD_USE_CUDNN: '0'
  NVTE_NORM_BWD_USE_CUDNN: '0'
  NVTE_FWD_LAYERNORM_SM_MARGIN: '32'
  NVTE_BWD_LAYERNORM_SM_MARGIN: '32'
  NUM_OF_TOKENS_PER_CHUNK_COMBINE_API: '128'
  NUM_OF_TOKENS_PER_CHUNK_DISPATCH_API: '128'
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  PYTHONWARNINGS: ignore
ARGS:
  # ---------- data (mock) + tokenizer ----------
  mock_data: true
  tokenizer_type: HuggingFaceTokenizer
  tokenizer_model: /data/minimax-dialogue/pretrain_model/m2-mini/tokenizer
  make_vocab_size_divisible_by: 32
  # ---------- model architecture (shrunk) ----------
  seed: 42
  num_layers: 4
  hidden_size: 512
  ffn_hidden_size: 1024
  num_attention_heads: 8
  kv_channels: 64
  group_query_attention: true
  num_query_groups: 2
  normalization: RMSNorm
  norm_epsilon: 1e-6
  disable_bias_linear: true
  untie_embeddings_and_output_weights: true
  swiglu: true
  qk_layernorm: true
  # ---------- full (non-varlen) attention ----------
  attention_backend: auto
  attention_dropout: 0.0
  hidden_dropout: 0.0
  # ---------- position embedding ----------
  position_embedding_type: rope
  rotary_base: 500000
  rotary_percent: 0.25
  max_position_embeddings: 512
  seq_length: 512
  # ---------- MoE ----------
  num_experts: 8
  moe_ffn_hidden_size: 512
  moe_router_topk: 4
  moe_router_score_function: sigmoid
  moe_router_dtype: fp32
  moe_router_load_balancing_type: aux_loss
  moe_aux_loss_coeff: 1e-4
  moe_router_enable_expert_bias: true
  moe_router_bias_update_rate: 1e-3
  moe_layer_freq: ([0]*1+[1]*3)
  moe_grouped_gemm: true
  moe_permute_fusion: true
  moe_router_fusion: true
  moe_router_padding_for_quantization: true
  moe_router_force_load_balancing: true
  moe_shared_expert_intermediate_size: 512
  # ---------- parallelism (single-node: TP1 PP2 EP4 CP1 -> 8 GPUs) ----------
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 2
  # EP A2A overlap (overlap_moe_expert_parallel_comm) with PP>1 requires VPP.
  # 4 layers / PP2 / VPP2 -> 1 layer per virtual pipeline stage.
  num_layers_per_virtual_pipeline_stage: 1
  expert_model_parallel_size: 4
  expert_tensor_parallel_size: 1
  context_parallel_size: 1
  cp_comm_type: a2a
  sequence_parallel: true
  use_distributed_optimizer: true
  # ---------- DeepEP sync-free dispatch (no paged stash, no grouped tensor) ----------
  moe_token_dispatcher_type: flex
  moe_flex_dispatcher_backend: deepep
  # ---------- 1F1B combined EP-A2A overlap ----------
  overlap_moe_expert_parallel_comm: true
  delay_wgrad_compute: true
  te_rng_tracker: true
  # ---------- MTP ----------
  mtp_num_layers: 1
  mtp_loss_scaling_factor: 0.3
  # ---------- schedule ----------
  micro_batch_size: 1
  global_batch_size: 8
  train_iters: 10
  # ---------- optimizer / lr (adam) ----------
  optimizer: adam
  lr: 2e-4
  min_lr: 1e-4
  lr_decay_style: cosine
  lr_decay_iters: 100
  lr_warmup_iters: 2
  lr_warmup_init: 0.0
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1e-20
  clip_grad: 1.0
  init_method_std: 0.006
  override_opt_param_scheduler: true
  # ---------- precision (bf16 + mxfp8) ----------
  bf16: true
  fp8_format: e4m3
  fp8_recipe: mxfp8
  # fp8_param_gather + mxfp8 raises "replace_raw_data for MXFP8Tensor is not
  # supported yet" in TE 2.19 (the version in BOTH the CI image and the online
  # job image), so it cannot be used with mxfp8 today. The online job never hit
  # this only because it died earlier at argparse; once that is fixed the online
  # config would hit it too. Keep disabled until TE implements MXFP8Tensor
  # replace_raw_data.
  fp8_param_gather: false
  accumulate_allreduce_grads_in_fp32: true
  main_grads_dtype: fp32
  main_params_dtype: fp32
  exp_avg_dtype: fp32
  exp_avg_sq_dtype: fp32
  use_precision_aware_optimizer: true
  overlap_grad_reduce: true
  overlap_param_gather: true
  # ---------- recompute (linear_qkv dropped: unsupported in this repo) ----------
  recompute_granularity: selective
  recompute_modules: [moe_act, layernorm]
  # ---------- runtime / misc ----------
  use_mcore_models: true
  use_flash_attn: true
  transformer_impl: transformer_engine
  no_create_attention_mask_in_dataloader: true
  no_check_for_nan_in_loss_and_grad: true
  calculate_per_token_loss: true
  cross_entropy_loss_fusion: true
  cross_entropy_fusion_impl: native
  manual_gc: true
  manual_gc_interval: 30
  distributed_timeout_minutes: 30
  enable_experimental: true
  # ---------- logging / eval ----------
  eval_iters: 0
  eval_interval: 20000000
  log_throughput: true
  log_interval: 1
  logging_level: 40
