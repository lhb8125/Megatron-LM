# ============================================================
# M3-Mini-style GPT-MoE — full attention + mock data + sync-free DeepEP
#
# Mirror of the online job j-5gkeia28y4 ("[sync-free][prof] NV Megatron DeepEP
# baseline"): the DeepEP flex dispatcher (NOT hybridep), with NO paged stash and
# NO device-init GroupedTensor. Kept from that job: topology (TP1/PP2/EP16/CP4),
# model size (28 layers, hidden 7168, 48 experts, moe_ffn 5120, top-4), MoE freq,
# precision, logging, 1F1B combined EP-A2A overlap.
#
# Two bugs from the online yaml are fixed here:
#   * VPP required          overlap_moe_expert_parallel_comm with PP>1 asserts
#                           unless virtual_pipeline_model_parallel_size is set;
#                           added num_layers_per_virtual_pipeline_stage.
#   * recompute_modules     online used [moe_act, layernorm, linear_qkv], but
#                           this repo's selective recompute does not support
#                           linear_qkv, so it is dropped.
#
# Consumed by examples/sync_free_hybridep/pretrain.sh. See
# config_m3mini_syncfree_min.yaml for a single-node smoke-test shrink.
ENV_VARS:
  NVTE_ALLOW_NONDETERMINISTIC_ALGO: '1'
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  CUDA_DEVICE_MAX_CONNECTIONS: '1'
  NCCL_NVLS_ENABLE: '0'
  NCCL_GRAPH_REGISTER: '0'
  NCCL_DEBUG: WARN
  NVTE_FUSED_ATTN: '1'
  NVTE_NORM_FWD_USE_CUDNN: '0'
  NVTE_NORM_BWD_USE_CUDNN: '0'
  NVTE_FWD_LAYERNORM_SM_MARGIN: '32'
  NVTE_BWD_LAYERNORM_SM_MARGIN: '32'
  NUM_OF_TOKENS_PER_CHUNK_COMBINE_API: '128'
  NUM_OF_TOKENS_PER_CHUNK_DISPATCH_API: '128'
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  PYTHONWARNINGS: ignore
ARGS:
  # ---------- data (mock) + tokenizer ----------
  mock_data: true
  tokenizer_type: HuggingFaceTokenizer
  tokenizer_model: /data/minimax-dialogue/pretrain_model/m2-mini/tokenizer
  make_vocab_size_divisible_by: 32
  # ---------- model architecture (from the M3-Mini job) ----------
  seed: 42
  num_layers: 28
  hidden_size: 7168
  ffn_hidden_size: 20480
  num_attention_heads: 128
  kv_channels: 256
  group_query_attention: true
  num_query_groups: 8
  normalization: RMSNorm
  norm_epsilon: 1e-6
  disable_bias_linear: true
  untie_embeddings_and_output_weights: true
  swiglu: true
  qk_layernorm: true
  # ---------- full (non-varlen) attention ----------
  attention_backend: auto
  attention_dropout: 0.0
  hidden_dropout: 0.0
  # ---------- position embedding ----------
  position_embedding_type: rope
  rotary_base: 500000
  rotary_percent: 0.25
  max_position_embeddings: 24576
  seq_length: 24576
  # ---------- MoE ----------
  num_experts: 48
  moe_ffn_hidden_size: 5120
  moe_router_topk: 4
  moe_router_score_function: sigmoid
  moe_router_dtype: fp32
  moe_router_load_balancing_type: aux_loss
  moe_aux_loss_coeff: 1e-4
  moe_router_enable_expert_bias: true
  moe_router_bias_update_rate: 1e-3
  moe_layer_freq: ([0]*4+[1]*24)
  moe_grouped_gemm: true
  moe_permute_fusion: true
  moe_router_fusion: true
  moe_router_padding_for_quantization: true
  moe_router_force_load_balancing: true
  moe_shared_expert_intermediate_size: 5120
  # ---------- parallelism (online DeepEP job topology) ----------
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 2
  # EP A2A overlap (overlap_moe_expert_parallel_comm) with PP>1 requires VPP.
  # 28 layers / PP2 -> 14 layers per stage; VPP with 1 layer per virtual stage.
  num_layers_per_virtual_pipeline_stage: 1
  expert_model_parallel_size: 16
  expert_tensor_parallel_size: 1
  context_parallel_size: 4
  cp_comm_type: a2a
  sequence_parallel: true
  use_distributed_optimizer: true
  # ---------- DeepEP sync-free dispatch (no paged stash, no grouped tensor) ----------
  moe_token_dispatcher_type: flex
  moe_flex_dispatcher_backend: deepep
  # ---------- 1F1B combined EP-A2A overlap ----------
  overlap_moe_expert_parallel_comm: true
  delay_wgrad_compute: true
  te_rng_tracker: true
  # ---------- MTP ----------
  mtp_num_layers: 1
  mtp_loss_scaling_factor: 0.3
  # ---------- schedule ----------
  micro_batch_size: 1
  global_batch_size: 768
  train_iters: 1000
  # ---------- optimizer / lr (adam) ----------
  optimizer: adam
  lr: 2e-4
  min_lr: 1e-4
  lr_decay_style: cosine
  lr_decay_iters: 3600
  lr_warmup_iters: 100
  lr_warmup_init: 0.0
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1e-20
  clip_grad: 1.0
  init_method_std: 0.006
  override_opt_param_scheduler: true
  # ---------- precision (bf16 + mxfp8) ----------
  bf16: true
  fp8_format: e4m3
  fp8_recipe: mxfp8
  # NOTE: the online job set fp8_param_gather: true, but TE 2.19 (used by both
  # the CI image and the online job image) raises "replace_raw_data for
  # MXFP8Tensor is not supported yet" at model build. The online job never
  # reached that point because it died earlier at argparse (moe-layer-freq).
  # Disabled here so the DeepEP recipe actually runs; re-enable once TE
  # implements MXFP8Tensor replace_raw_data.
  fp8_param_gather: false
  accumulate_allreduce_grads_in_fp32: true
  main_grads_dtype: fp32
  main_params_dtype: fp32
  exp_avg_dtype: fp32
  exp_avg_sq_dtype: fp32
  use_precision_aware_optimizer: true
  overlap_grad_reduce: true
  overlap_param_gather: true
  # ---------- recompute (linear_qkv dropped: unsupported in this repo) ----------
  recompute_granularity: selective
  recompute_modules: [moe_act, layernorm]
  # ---------- runtime / misc ----------
  use_mcore_models: true
  use_flash_attn: true
  transformer_impl: transformer_engine
  no_create_attention_mask_in_dataloader: true
  no_check_for_nan_in_loss_and_grad: true
  calculate_per_token_loss: true
  cross_entropy_loss_fusion: true
  cross_entropy_fusion_impl: native
  manual_gc: true
  manual_gc_interval: 30
  distributed_timeout_minutes: 30
  enable_experimental: true
  # ---------- logging / eval ----------
  eval_iters: 0
  eval_interval: 20000000
  log_throughput: true
  log_interval: 1
  logging_level: 40
